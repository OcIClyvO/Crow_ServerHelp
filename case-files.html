<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CLASSIFIED // CASE FILES</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0a0a;
    color: #33ff33;
    font-family: 'Courier New', monospace;
  }

  .layout {
    display: flex;
    min-height: 100vh;
  }

  /* ---- SIDEBAR ---- */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    background: #0f0f0f;
    border-right: 1px solid #33ff33;
    padding: 24px 0;
  }
  .sidebar-title {
    color: #33ff33;
    font-size: 14px;
    letter-spacing: 3px;
    padding: 0 20px 16px 20px;
    border-bottom: 1px solid #1f1f1f;
    margin-bottom: 10px;
  }
  .sidebar-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-left: 3px solid transparent;
    color: #33ff33;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 1px;
    padding: 12px 20px;
    cursor: pointer;
    opacity: 0.7;
  }
  .sidebar-item:hover {
    background: #142214;
    opacity: 1;
  }
  .sidebar-item.active {
    border-left-color: #33ff33;
    background: #142214;
    opacity: 1;
    font-weight: bold;
  }

  /* ---- MAIN CONTENT ---- */
  .main {
    flex: 1;
    padding: 40px 48px;
    max-width: 1400px;
  }
  .breadcrumb {
    font-size: 12px;
    opacity: 0.6;
    margin-bottom: 20px;
    letter-spacing: 1px;
  }
  .breadcrumb span { opacity: 0.4; margin: 0 6px; }
  .breadcrumb .current { opacity: 0.9; }

  h1 {
    letter-spacing: 3px;
    margin-top: 0;
  }
  .stamp {
    display: inline-block;
    border: 2px solid #ff3333;
    color: #ff3333;
    padding: 4px 10px;
    font-weight: bold;
    transform: rotate(-3deg);
    margin-bottom: 10px;
  }
  .intro-box {
    border-top: 1px solid #33ff33;
    border-bottom: 1px solid #33ff33;
    padding: 18px 0;
    margin: 20px 0 34px 0;
    opacity: 0.85;
    line-height: 1.6;
  }

  /* ---- CASE GRID ---- */
  #case-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(650px, 1fr));
    gap: 40px;
    align-items: start;
  }

  .case-file {
    border: 1px solid #33ff33;
    background: #0f0f0f;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    overflow: hidden;
  }
  .case-file:hover { background: #142214; }
  .case-file.selected {
    border-color: #ffffff;
    background: #142214;
  }

  .case-image {
    width: 100%;
    height: 380px;
    object-fit: cover;
    display: block;
    border-bottom: 1px solid #33ff33;
    filter: grayscale(40%) contrast(110%);
  }
  .case-image-placeholder {
    width: 100%;
    height: 380px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px dashed #333;
    font-size: 14px;
    opacity: 0.4;
    letter-spacing: 3px;
  }

  .case-body { padding: 34px; }

  .case-file-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .meta { font-size: 12px; opacity: 0.7; }
  .status {
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1px;
    padding: 4px 10px;
    border: 1px solid;
    white-space: nowrap;
  }
  .status.alive { color: #33ff33; border-color: #33ff33; }
  .status.dead { color: #ff3333; border-color: #ff3333; }
  .status.unknown { color: #ffcc33; border-color: #ffcc33; }
  .status.missing { color: #ff9933; border-color: #ff9933; }
  .status.classified { color: #cccccc; border-color: #cccccc; }
  .status.compromised { color: #ff33cc; border-color: #ff33cc; }
  .status.contained { color: #33ccff; border-color: #33ccff; }
  .status.active { color: #99ff33; border-color: #99ff33; }
  .status.terminated { color: #990000; border-color: #990000; }

  .case-file h2 { margin: 16px 0 12px 0; font-size: 26px; letter-spacing: 2px; }
  .case-file p { margin: 0; line-height: 1.8; font-size: 16px; }
  .details {
    display: none;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px dashed #333;
    font-size: 16px;
    line-height: 1.9;
    opacity: 0.9;
  }
  .case-file.selected .details { display: block; }
  .details img {
    max-width: 100%;
    margin-top: 10px;
    border: 1px solid #33ff33;
    filter: grayscale(40%) contrast(110%);
  }

  .redacted { background: #33ff33; color: #33ff33; user-select: none; }

  /* mobile */
  @media (max-width: 800px) {
    .layout { flex-direction: column; }
    .sidebar {
      width: 100%;
      border-right: none;
      border-bottom: 1px solid #33ff33;
      display: flex;
      overflow-x: auto;
      padding: 10px 0;
    }
    .sidebar-title { display: none; }
    .sidebar-item {
      border-left: none;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
    }
    .sidebar-item.active { border-left: none; border-bottom-color: #33ff33; }
    .main { padding: 24px; }
  }
</style>
</head>
<body>

<div class="layout">

  <div class="sidebar">
    <div class="sidebar-title">CASE ARCHIVE</div>
    <div id="sidebar-items"></div>
  </div>

  <div class="main">
    <div class="breadcrumb">
      HOME <span>&gt;</span> CASE ARCHIVE <span>&gt;</span>
      <span class="current" id="breadcrumb-current"></span>
    </div>

    <span class="stamp">TOP SECRET</span>
    <h1 id="page-title"></h1>
    <div class="intro-box" id="page-intro"></div>

    <div id="case-container"></div>
  </div>

</div>

<!--
  Add more pages/sections by editing the PAGES array in the script below.
  Each entry is one sidebar item, with its own title, intro text, and list of cases.

  To add an image to a case, set "image" to an image path, e.g.
  image: "images/file-001.jpg"
  Leave it null if you don't have one -- a placeholder will show instead.

  Available status values:
  alive, dead, unknown, missing, classified, compromised, contained, active, terminated
-->

<script>
  // ---- ADD YOUR SECTIONS / PAGES HERE ----
  const PAGES = [
    {
      label: "OPEN CASES",
      title: "OPEN CASE FILES",
      intro: "Locate an active investigation using the archive below. Select any file to expand its record.",
      cases: [
        {
          id: "001",
          subject: "THE FREQUENCY",
          status: "unknown",
          image: null,
          summary: "Recovered transmission logs indicate a repeating signal broadcast every night.",
          details: "Frequency: <span class='redacted'>14.2 MHz</span>. Time: <span class='redacted'>03:17</span>. Origin unconfirmed.<br><br>The signal was first detected by an amateur radio operator in the northern sector, who reported it to local authorities after three consecutive nights of identical playback. Analysts who later reviewed the recording noted that the waveform does not correspond to any registered broadcast license in the region. Attempts to triangulate the source have failed twice, with both search teams reporting equipment malfunctions at the estimated origin point.<br><br>A partial transcript was recovered from the audio, though most of it remains unintelligible. The portion that could be parsed consists of a repeating count-up sequence followed by a burst of static lasting exactly eleven seconds. No pattern has been found linking the eleven-second interval to any known coordinate system, though several analysts have proposed it may correspond to a countdown rather than a location.<br><br>Three independent monitoring stations have since picked up the same signal, each reporting it at a slightly different time, always within the same four-hour window. Command has classified this file as ongoing and instructed all field units to report any additional receptions immediately, regardless of signal strength or clarity."
        },
        {
          id: "002",
          subject: "UNKNOWN CONTACT",
          status: "missing",
          image: null,
          summary: "Witness reports describe a figure who left only a single phrase before vanishing.",
          details: "Final words recorded: \"the static was never noise.\" No further sightings reported since."
        },
        {
          id: "003",
          subject: "SUBJECT M.",
          status: "dead",
          image: null,
          summary: "Confirmed deceased. Cause of death remains classified.",
          details: "Last known location redacted. Personal effects recovered included a notebook filled with coordinates."
        }
      ]
    },
    {
      label: "CLOSED CASES",
      title: "CLOSED CASE FILES",
      intro: "These investigations have been resolved or archived. Records remain available for cross-reference.",
      cases: [
        {
          id: "004",
          subject: "THE ARCHIVIST",
          status: "compromised",
          image: null,
          summary: "Believed responsible for cataloguing all prior case files.",
          details: "No photograph on record. Handwriting matches annotations found throughout Files 001-003."
        },
        {
          id: "005",
          subject: "SECOND SIGNAL",
          status: "terminated",
          image: null,
          summary: "A new transmission began the night File 003 was closed. Signal has since gone silent.",
          details: "Signal strength peaked then dropped to zero over 48 hours. Cause unknown."
        }
      ]
    },
    {
      label: "CONTAINMENT",
      title: "CONTAINMENT SITES",
      intro: "Locations currently under observation or lockdown.",
      cases: [
        {
          id: "006",
          subject: "CONTAINMENT SITE 7",
          status: "contained",
          image: null,
          summary: "Location secured following Incident 004.",
          details: "Perimeter holding. No further activity reported for 6 days."
        }
      ]
    }
  ];
  // ---- END SECTION DATA ----

  let currentPageIndex = 0;

  function renderSidebar() {
    const container = document.getElementById('sidebar-items');
    container.innerHTML = '';
    PAGES.forEach(function(page, index) {
      const btn = document.createElement('button');
      btn.className = 'sidebar-item' + (index === currentPageIndex ? ' active' : '');
      btn.textContent = page.label;
      btn.onclick = function() {
        currentPageIndex = index;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      container.appendChild(btn);
    });
  }

  function renderCases() {
    const container = document.getElementById('case-container');
    container.innerHTML = '';

    const page = PAGES[currentPageIndex];
    page.cases.forEach(function(item) {
      const div = document.createElement('div');
      div.className = 'case-file';
      div.onclick = function() {
        div.classList.toggle('selected');
      };

      const imageHtml = item.image
        ? '<img class="case-image" src="' + item.image + '" alt="' + item.subject + '">'
        : '<div class="case-image-placeholder">NO IMAGE ON FILE</div>';

      div.innerHTML =
        imageHtml +
        '<div class="case-body">' +
          '<div class="case-file-top">' +
            '<span class="meta">FILE NO. ' + item.id + '</span>' +
            '<span class="status ' + item.status + '">' + item.status.toUpperCase() + '</span>' +
          '</div>' +
          '<h2>' + item.subject + '</h2>' +
          '<p>' + item.summary + '</p>' +
          '<div class="details">' + item.details + '</div>' +
        '</div>';

      container.appendChild(div);
    });
  }

  function render() {
    const page = PAGES[currentPageIndex];
    document.getElementById('page-title').textContent = page.title;
    document.getElementById('page-intro').textContent = page.intro;
    document.getElementById('breadcrumb-current').textContent = page.label;
    renderSidebar();
    renderCases();
  }

  render();
</script>

</body>
</html>
